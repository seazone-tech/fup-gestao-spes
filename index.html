<title>SpotSys — FUP: Gestão de SPEs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --primary:#0055FF;--primary-fg:#FFF;
  --sidebar-bg:#FFF;--sidebar-fg:#080E32;--sidebar-active-bg:#193CB8;--sidebar-active-fg:#FFF;--sidebar-hover:#F3F3F5;
  --bg:#FFF;--fg:#080E32;--card:#FFF;--card-fg:#141A3C;--border:#E6E7EA;--muted:#E6E7EA;--muted-fg:#6B6E84;--accent:#F3F3F5;
  --success:#059669;--warn:#CA3500;--warn-bg:#FFD6A8;--danger:#E7000B;--danger-bg:#FFE2E2;
  --font:'Helvetica Neue',-apple-system,BlinkMacSystemFont,sans-serif;--r-lg:8px;--r-xl:12px;--r-full:9999px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#3D7FFF;--sidebar-bg:#060C18;--sidebar-fg:#EDF0FA;--sidebar-active-bg:#3D7FFF;--sidebar-hover:#101422;
  --bg:#080D1C;--fg:#EDF0FA;--card:#0E1326;--card-fg:#EDF0FA;--border:#242840;--muted:#161B30;--muted-fg:#8A8FAD;--accent:#131829;
  --warn-bg:#441306;--danger-bg:#460809;
}}
:root[data-theme="dark"]{
  --primary:#3D7FFF;--sidebar-bg:#060C18;--sidebar-fg:#EDF0FA;--sidebar-active-bg:#3D7FFF;--sidebar-hover:#101422;
  --bg:#080D1C;--fg:#EDF0FA;--card:#0E1326;--card-fg:#EDF0FA;--border:#242840;--muted:#161B30;--muted-fg:#8A8FAD;--accent:#131829;
  --warn-bg:#441306;--danger-bg:#460809;
}
:root[data-theme="light"]{
  --primary:#0055FF;--sidebar-bg:#FFF;--sidebar-fg:#080E32;--sidebar-active-bg:#193CB8;--sidebar-hover:#F3F3F5;
  --bg:#FFF;--fg:#080E32;--card:#FFF;--card-fg:#141A3C;--border:#E6E7EA;--muted:#E6E7EA;--muted-fg:#6B6E84;--accent:#F3F3F5;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--fg);font-size:14px}
.shell{display:flex;height:100vh;overflow:hidden}
/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-logo{padding:16px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:28px;height:28px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.logo-text{font-size:15px;font-weight:700}.logo-sub{font-size:10px;font-weight:400;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.03em}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:1px}
.sidebar-nav::-webkit-scrollbar{width:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-lg);cursor:pointer;color:var(--sidebar-fg);font-size:13px;font-weight:500;transition:background 120ms}
.nav-item:hover{background:var(--sidebar-hover)}.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-fg)}
.nav-sub{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 32px;border-radius:var(--r-lg);cursor:pointer;color:var(--sidebar-fg);font-size:12px;font-weight:500;transition:background 120ms}
.nav-sub:hover{background:var(--sidebar-hover)}.nav-sub.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-fg)}
.nav-section{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg);padding:12px 10px 4px}
.nav-divider{height:1px;background:var(--border);margin:6px 4px}
.sidebar-user{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.user-name{font-size:12px;font-weight:600}.user-email{font-size:10px;color:var(--muted-fg)}
.user-tag{display:inline-block;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);font-size:10px;font-weight:700;margin-top:2px}
/* MAIN */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:6px}.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.topbar{height:52px;flex-shrink:0;border-bottom:1px solid var(--border);padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:10}
.topbar-path{font-size:12px;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.topbar-path span{color:var(--fg);font-weight:600}
.theme-btn{padding:6px 10px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--card);color:var(--muted-fg);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:var(--font)}
.content{padding:28px;flex:1}
.module-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.module-icon{width:42px;height:42px;border-radius:11px;background:var(--primary);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in srgb,var(--primary) 30%,transparent)}
.module-title{font-size:20px;font-weight:700;letter-spacing:-.01em}
.module-sub{font-size:11px;color:var(--muted-fg);margin-top:2px}
/* CONTROLS */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.select-building{flex:1 1 220px;max-width:320px;padding:8px 12px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:13px;font-family:var(--font);cursor:pointer;outline:none}
.view-toggle{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:3px}
.view-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;font-size:12px;font-weight:600;background:transparent;color:var(--muted-fg);border:none;cursor:pointer;font-family:var(--font);transition:all 150ms;white-space:nowrap}
.view-btn.active{background:var(--primary);color:#fff}.view-btn:not(.active):hover{background:var(--accent);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-lg);font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--fg);cursor:pointer;font-family:var(--font)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
/* OVERVIEW GRID */
.overview-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.overview-stat{display:flex;flex-direction:column;gap:2px;padding:10px 16px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.overview-stat-n{font-size:22px;font-weight:800;line-height:1}
.overview-stat-l{font-size:10px;color:var(--muted-fg);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
/* SPLIT LAYOUT */
.painel-split{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.painel-list{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);overflow-y:auto;max-height:calc(100vh - 152px);position:sticky;top:16px}
.painel-list-item{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;transition:background 100ms;user-select:none}
.painel-list-item:last-child{border-bottom:none}
.painel-list-item:hover{background:var(--accent)}
.painel-list-item.pli-active{background:color-mix(in srgb,var(--primary) 7%,transparent);border-left:3px solid var(--primary)}
.painel-list-item:not(.pli-active){border-left:3px solid transparent}
.pli-nome{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--card-fg)}
.pli-active .pli-nome{color:var(--primary);font-weight:600}
.pli-dots{display:flex;gap:4px;flex-shrink:0}
.pli-dot{width:7px;height:7px;border-radius:50%}
.painel-detail-wrap{min-width:0}
.painel-detail-wrap .detail-back{display:none}
.emp-mini{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);padding:14px 16px;cursor:pointer;transition:box-shadow 120ms,border-color 120ms;display:flex;flex-direction:column;gap:8px}
.emp-mini:hover{box-shadow:0 4px 16px color-mix(in srgb,var(--primary) 12%,transparent);border-color:color-mix(in srgb,var(--primary) 30%,var(--border))}
.emp-mini.brd-critico{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.emp-mini.brd-atencao{border-color:color-mix(in srgb,var(--warn) 35%,var(--border))}
.emp-mini-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.emp-code{font-size:10px;font-weight:700;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.score-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
.score-dot.critico{background:var(--danger-bg);color:var(--danger)}
.score-dot.atencao{background:var(--warn-bg);color:var(--warn)}
.score-dot.ok{background:#DCFCE7;color:#166534}
:root[data-theme="dark"] .score-dot.ok{background:#052E16;color:#4ADE80}
:root[data-theme="dark"] .score-dot.atencao{background:#3A3200;color:#FFE94D}
:root[data-theme="dark"] .score-dot.critico{background:#450A0A;color:#FCA5A5}
.emp-mini-name{font-size:13px;font-weight:700;color:var(--card-fg);line-height:1.3}
.fase-pill{display:inline-block;padding:2px 10px;border-radius:var(--r-full);font-size:11px;font-weight:600;background:var(--accent);color:var(--muted-fg)}
.fase-pill.preobra,.fase-pill.obra,.fase-pill.entrega{background:var(--accent);color:var(--muted-fg)}
.mini-bar-row{display:flex;align-items:center;gap:6px}
.mini-bar-track{flex:1;height:4px;background:var(--muted);border-radius:2px;overflow:hidden}
.mini-bar-fill{height:100%;border-radius:2px;background:var(--primary)}
.mini-bar-pct{font-size:10px;font-weight:700;color:var(--muted-fg);width:28px;text-align:right;font-variant-numeric:tabular-nums}
/* DETAIL PAGE */
.detail-page{display:flex;flex-direction:column;gap:20px}
.detail-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted-fg);cursor:pointer;padding:6px 10px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--card);margin-bottom:4px}
.detail-back:hover{background:var(--accent)}
/* Detail Hero */
.detail-hero{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);overflow:hidden}
.hero-stripe{height:5px}
.hero-stripe.critico{background:var(--danger)}
.hero-stripe.atencao{background:var(--warn)}
.hero-stripe.ok{background:var(--success)}
.hero-body{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-name{font-size:18px;font-weight:400;color:var(--card-fg);letter-spacing:-.02em;line-height:1.2}
.hero-farois{display:flex;gap:14px;flex-shrink:0}
.urg-badge{padding:4px 14px;border-radius:var(--r-full);font-size:11px;font-weight:700}
.urg-critico{background:var(--danger-bg);color:var(--danger)}
.urg-atencao{background:var(--warn-bg);color:var(--warn)}
.urg-ok{background:#DCFCE7;color:#166534}
:root[data-theme="dark"] .urg-ok{background:#052E16;color:#4ADE80}
:root[data-theme="dark"] .urg-atencao{background:#3A3200;color:#FFE94D}
:root[data-theme="dark"] .urg-critico{background:#450A0A;color:#FCA5A5}
.dchips-row{display:flex;gap:8px;flex-wrap:wrap}
.dchip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;border-radius:var(--r-lg);background:var(--accent);border:1px solid var(--border);min-width:88px}
.dchip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.dchip-value{font-size:12px;font-weight:700;color:var(--card-fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.dchip-value.late{color:var(--danger)}
.hero-prog{display:flex;flex-direction:column;gap:9px}
.prog-row{display:flex;align-items:center;gap:10px}
.prog-label{font-size:11px;font-weight:600;color:var(--muted-fg);width:130px;flex-shrink:0}
.prog-track{flex:1;height:8px;background:var(--muted);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px}
.prog-fill.f{background:var(--primary)}
.prog-fill.fin{background:var(--success)}
.prog-pct{font-size:12px;font-weight:700;color:var(--card-fg);width:36px;text-align:right;font-variant-numeric:tabular-nums}
/* CRONOGRAMA CARD TABLE */
.cron-card{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);overflow:hidden}
.cron-card-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--card-fg);letter-spacing:-.01em;background:var(--accent)}
.cron-table{width:100%;border-collapse:collapse;font-size:12px}
.cron-table thead th{padding:6px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);text-align:right;background:var(--accent);border-bottom:1px solid var(--border)}
.cron-table thead th:first-child{text-align:left;min-width:200px}
.cron-table tbody td{padding:6px 14px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:11px;font-weight:400}
.cron-table tbody tr:last-child td,.cron-table tbody .sub-last td{border-bottom:1px solid var(--border)}
.cron-table tbody tr:last-child td{border-bottom:none}
.date-cell{text-align:center;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap;color:var(--muted-fg)}
.cron-row-andamento .date-cell{color:var(--muted-fg)}
.cron-name-cell{display:flex;align-items:center;gap:8px}
.cron-dot-s{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.cron-dot-s.concluido{background:var(--success)}
.cron-dot-s.andamento{background:var(--primary)}
.cron-dot-s.proximo{background:var(--primary);animation:cdot-pulse 2s infinite}
.cron-dot-s.ainicial{background:var(--card);border:1.5px solid var(--border)}
.cron-marco-nome.concluido{color:var(--muted-fg)}
.cron-marco-nome.andamento{color:var(--primary);font-weight:700}
.cron-marco-nome.ainicial{color:var(--muted-fg);opacity:.5}
@keyframes cdot-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 30%,transparent)}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--primary) 0%,transparent)}}
/* Sub-marcos */
.cron-sub-row td{padding:4px 14px 4px 42px;border-bottom:none;background:color-mix(in srgb,var(--accent) 60%,var(--card))}
.cron-sub-row:last-of-type td{border-bottom:1px solid var(--border)}
.cron-sub-cell{display:flex;align-items:center;gap:6px;font-size:12px}
.cron-sub-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cron-sub-dot.concluido{background:var(--success)}
.cron-sub-dot.andamento{background:var(--primary)}
.cron-sub-dot.ainicial{background:var(--border)}
.marco-dates{font-size:10px;color:var(--muted-fg);margin-left:26px;display:flex;gap:8px;flex-wrap:wrap}
.marco-dates span{display:inline-flex;align-items:center;gap:3px}
.sub-list{margin-left:26px;margin-top:3px;display:flex;flex-direction:column;gap:2px}
.sub-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted-fg)}
.sub-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sub-dot.concluido{background:var(--success)}
.sub-dot.andamento{background:var(--primary)}
.sub-dot.ainicial{background:var(--muted-fg)}
/* CAIXINHAS GRID */
.caixinhas-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.caixinhas-grid{grid-template-columns:1fr}}
.caixinha{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);overflow:hidden;display:flex;flex-direction:column}
.cx-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--accent)}
.cx-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.cx-icon-ia{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.cx-icon-ass{background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.cx-icon-com{background:color-mix(in srgb,#7C3AED 14%,transparent);color:#7C3AED}
.cx-icon-cap{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.cx-title{font-size:11px;font-weight:700;color:var(--card-fg);flex:1;letter-spacing:-.01em}
.cx-badge-count{padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:700;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.cx-body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
/* IA items */
.ia-item-new{border-left:3px solid;padding:8px 10px;border-radius:0 var(--r-lg) var(--r-lg) 0;background:var(--accent);display:flex;flex-direction:column;gap:4px}
.ia-item-new.reuniao{border-color:var(--primary)}
.ia-item-new.wpp{border-color:var(--success)}
.ia-item-tag{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.ia-fonte{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;display:inline-block}
.ia-fonte.reuniao{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary)}
.ia-fonte.wpp{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}
.ia-text{font-size:12px;color:var(--card-fg);line-height:1.5}
/* Assembleias rows */
.ass-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ass-row:last-child{border-bottom:none;padding-bottom:0}
.ass-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.ass-icon-cal{background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary)}
.ass-icon-doc{background:color-mix(in srgb,var(--success) 10%,transparent);color:var(--success)}
.ass-info{flex:1;display:flex;flex-direction:column;gap:2px}
.ass-label{font-size:11px;font-weight:600;color:var(--card-fg)}
.ass-sub{font-size:10px;color:var(--muted-fg)}
.mini-pill{padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:700}
.mp-prev{background:color-mix(in srgb,var(--muted-fg) 12%,transparent);color:var(--muted-fg)}
.mp-conf{background:#DCFCE7;color:#166534}
:root[data-theme="dark"] .mp-conf{background:#052E16;color:#4ADE80}
.mp-and{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.mp-sem{background:var(--muted);color:var(--muted-fg)}
/* Comunicados */
.com-item{padding:10px;border-radius:var(--r-lg);background:var(--accent);display:flex;flex-direction:column;gap:5px}
.com-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.com-data{font-size:10px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.com-tipo{padding:1px 7px;border-radius:var(--r-full);font-size:10px;font-weight:700}
.ct-info{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.ct-urg{background:var(--danger-bg);color:var(--danger)}
.ct-fin{background:var(--warn-bg);color:var(--warn)}
.com-text{font-size:12px;color:var(--card-fg);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Chamada de Capital */
.cap-box{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.cap-box.alto{border-color:var(--danger)}
.cap-box.atencao{border-color:var(--warn)}
.cap-stripe{height:3px}
.cap-stripe.alto{background:var(--danger)}
.cap-stripe.atencao{background:var(--warn)}
.cap-stripe.ok{background:var(--success)}
.cap-inner{padding:10px 12px}
.cap-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cap-status{font-size:13px;font-weight:800;color:var(--card-fg)}
.risco-chip{padding:2px 9px;border-radius:var(--r-full);font-size:11px;font-weight:700}
.rc-alto{background:var(--danger-bg);color:var(--danger)}
.rc-atencao{background:var(--warn-bg);color:var(--warn)}
.rc-ok{background:#DCFCE7;color:#166534}
:root[data-theme="dark"] .rc-ok{background:#052E16;color:#4ADE80}

// Gera statuses de marco baseado na fase do empreendimento
function genMarcos(emp){
  const ordemFases=['preobra','obra','entrega'];
  const idxFase=ordemFases.indexOf(emp.fase);
  const result={};
  ordemFases.forEach((f,fi)=>{
    result[f]=MARCOS_DEF[f].map((m,mi)=>{
      let st;
      // Usa status armazenado do Smartsheet se disponível
      if(emp.marcos&&emp.marcos[f]&&emp.marcos[f][mi]){
        st=emp.marcos[f][mi].st;
      } else {
        if(fi<idxFase) st='concluido';
        else if(fi===idxFase){
          const total=MARCOS_DEF[f].length;
          const done=Math.floor((emp.pf/100)*(total-1));
          if(mi<done) st='concluido';
          else if(mi===done) st=(emp.risco==='alto'?'risco':emp.risco==='atencao'?'risco':'andamento');
          else st='ainicial';
        }
        else st='ainicial';
      }
      const subs=(m.subs||[]).map((s,si)=>({nome:s,st:(st==='concluido'?'concluido':si===0&&st==='andamento'?'andamento':'ainicial')}));
      return{nome:m.nome,st,subs};
    });
  });
  return result;
}

// Interpola datas dos 11 marcos a partir das datas-chave do empreendimento
function genMarcosDates(emp){
  const sm=SMARTSHEET_MARCOS[emp.id]||{};
  const N=MARCOS_SEQ.length;
  function lerp(d1,d2,f){
    if(!d1||!d2)return null;
    const t1=new Date(d1).getTime(),t2=new Date(d2).getTime();
    return new Date(Math.round(t1+(t2-t1)*f)).toISOString().split('T')[0];
  }
  const nk=NEKT_TIMELINES[emp.id]||{};
  return MARCOS_SEQ.map(function(_,i){
    // NEKT tem dados do informativo (prev. lançamento / prev. atualizada)
    const nkd=nk[i]||null;
    if(nkd&&(nkd.dl||nkd.dt)) return{dl:nkd.dl||null,dr:null,dt:nkd.dt||nkd.dl||null};
    // Fallback Smartsheet
    if(sm[i]) return{dl:sm[i].dl||null,dr:null,dt:sm[i].dt||null};
    // Fallback: interpolar das datas-chave do empreendimento
    const f=i===0?0:i/(N-1);
    const refEnd=emp.dr||emp.dt;
    const dlEndMs=refEnd?new Date(emp.dl).getTime()+(new Date(refEnd).getTime()-new Date(emp.dl).getTime())*0.8:null;
    const dlEnd=dlEndMs?new Date(dlEndMs).toISOString().split('T')[0]:null;
    return{
      dl:f===0?emp.dl:lerp(emp.dl,dlEnd||emp.dt,f),
      dr:emp.dr?(f===0?emp.dl:lerp(emp.dl,emp.dr,f)):null,
      dt:emp.dt?(f===0?emp.dl:lerp(emp.dl,emp.dt,f)):null,
    };
  });
}

// Gera sequência linear de 11 marcos com status para o detalhe
function genMarcosSeq(emp){
  const mo=emp.marcos||{};
  const pre=mo.preobra||[];
  const obr=mo.obra||[];
  const ent=mo.entrega||[];
  const fi={preobra:0,obra:1,entrega:2}[emp.fase]||0;
  function getSt(arr,i){
    const v=(arr[i]||{}).st||'ainicial';
    return(v==='risco'||v==='alerta')?'andamento':v;
  }
  const obraFin=fi>1?'concluido':fi===1?(
    obr.every(function(m){return(m.st||'ainicial')==='concluido';})?'concluido':
    obr.some(function(m){return['andamento','risco','alerta'].indexOf(m.st||'')>=0;})?'andamento':'ainicial'
  ):'ainicial';
  const sts=[
    emp.dl?'concluido':'ainicial',          // 0 Lançamento
    fi>0?'concluido':getSt(pre,0),          // 1 Alvará
    fi>0?'concluido':'ainicial',            // 2 Inicio das Obras
    fi>0?'concluido':getSt(pre,1),          // 3 Projetos Executivos
    fi>0?'concluido':getSt(pre,2),          // 4 Orçamento Executivo
    obraFin,                                // 5 Conclusão das Obras
    fi>1?getSt(ent,2):'ainicial',           // 6 Ligação Definitiva
    fi>1?getSt(ent,1):'ainicial',           // 7 Vistoria e Aceite das Chaves
    fi>1?getSt(ent,3):'ainicial',           // 8 Decor
    fi>1?getSt(ent,0):'ainicial',           // 9 Habite-se e Inicio das Operações
    fi>1?getSt(ent,4):'ainicial',           // 10 Individualização das Matrículas
  ];
  const sm=SMARTSHEET_MARCOS[emp.id]||{};
  const nkSeq=NEKT_TIMELINES[emp.id]||{};
  return MARCOS_SEQ.map(function(m,i){
    const st=nkSeq[i]?nkSeq[i].st:(sm[i]?sm[i].st:sts[i]);
    // Sub-marcos: herdam status proporcional ao do pai
    const subsArr=(m.subs||[]).map(function(s,si){
      if(st==='concluido')return{nome:s,st:'concluido'};
      if(st==='andamento')return{nome:s,st:si===0?'andamento':'ainicial'};
      return{nome:s,st:'ainicial'};
    });
    return{nome:m.nome,st:st,subs:subsArr};
  });
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function daysDiff(ds){if(!ds)return null;return Math.round((new Date(ds)-TODAY)/86400000);}
function atraso(emp){
  // diferença assinada: positivo = atrasado, negativo = adiantado
  const ref=emp.dr||emp.dl;
  if(!ref||!emp.dt)return 0;
  return Math.round((new Date(emp.dt)-new Date(ref))/86400000);
}
// Retorna o marco ativo (sequência linear) e seu atraso em dias
function marcoAtual(emp){
  const marcos=genMarcosSeq(emp);
  const at=atraso(emp);
  const emAnd=marcos.find(m=>m.st==='andamento');
  if(emAnd)return{nome:emAnd.nome,st:'andamento',atraso:at};
  const emAin=marcos.find(m=>m.st==='ainicial');
  if(emAin)return{nome:emAin.nome,st:'ainicial',atraso:0};
  return null;
}
function marcoAtualDt(emp){
  const marcos=genMarcosSeq(emp);
  const dates=genMarcosDates(emp);
  let idx=marcos.findIndex(function(m){return m.st==='andamento';});
  if(idx<0)idx=marcos.findIndex(function(m){return m.st==='ainicial';});
  return idx>=0?(dates[idx]||{}).dt||null:null;
}
function marcoAtualDates(emp){
  const marcos=genMarcosSeq(emp);
  const dates=genMarcosDates(emp);
  let idx=marcos.findIndex(function(m){return m.st==='andamento';});
  if(idx<0)idx=marcos.findIndex(function(m){return m.st==='ainicial';});
  return idx>=0?(dates[idx]||{dl:null,dr:null,dt:null}):{dl:null,dr:null,dt:null};
}
// Retorna array de marcos a exibir no Farol por empreendimento
// Quando o próximo é index 2 (Inicio das Obras), inclui também index 3 (Projetos Executivos)
function marcosAtivos(emp){
  const marcos=genMarcosSeq(emp);
  const dates=genMarcosDates(emp);
  let lastConclIdx=-1;
  marcos.forEach(function(m,i){if(m.st==='concluido')lastConclIdx=i;});
  const proxIdx=lastConclIdx+1;
  if(proxIdx>=marcos.length)return[];
  const result=[{nome:marcos[proxIdx].nome,st:marcos[proxIdx].st,idx:proxIdx,dates:dates[proxIdx]||{}}];
  if(proxIdx===2&&3<marcos.length){
    result.push({nome:marcos[3].nome,st:marcos[3].st,idx:3,dates:dates[3]||{}});
  }
  return result;
}
function calcScore(emp){
  const at=atraso(emp);
  const rc=emp.risco==='alto'?30:emp.risco==='atencao'?15:0;
  const ass=ASSEMBLEIAS[emp.id];
  const assV=ass&&ass.data&&daysDiff(ass.data)<-30?20:0;
  const pagV=emp.pag==='Paralisado'?15:emp.pag==='Em atraso'?10:0;
  return Math.min(100,Math.round(Math.min(at/3,45)+rc+assV+pagV));
}
function urgClass(s){return s>=70?'critico':s>=40?'atencao':'ok';}
function urgLabel(s){return s>=70?'🔴 Crítico':s>=40?'🟡 Atenção':'🟢 Ok';}
function fmtD(d){
  if(!d)return'—';
  // DD/MM/YYYY já no formato de exibição (armazenado antes da migração)
  if(/^\d{2}\/\d{2}\/\d{4}$/.test(d))return d;
  // YYYY-MM-DD → DD/MM/YYYY
  const[y,m,dy]=d.split('-');
  if(!dy||!m||!y||y==='undefined')return'—';
  return`${dy}/${m}/${y}`;
}

    return`<div class="painel-list-item ${act}" data-id="${e.id}" onclick="goToEmp('${e.id}')">

      <span class="pli-dots">

        <span class="pli-dot" style="background:${dotC(fc)}"></span>
      </span>
    </div>`;
  }).join('');
  c.innerHTML=`<div class="painel-split">
    <div class="painel-list" id="painelList">${listHtml}</div>
    <div class="painel-detail-wrap" id="painel-detail">${emp?renderDetail(emp):''}</div>

}

function goToEmp(id){
  curEmpId=id;
  const sel=document.getElementById('buildingSelect');
  if(sel)sel.value=id;
  // Update active state in list without full re-render
  document.querySelectorAll('.painel-list-item').forEach(function(el){
    const active=el.dataset.id===id;
    el.classList.toggle('pli-active',active);
  });
  // Update detail panel only
  const emp=EMPS_RAW.find(function(e){return e.id===id;});
  const det=document.getElementById('painel-detail');
  if(emp&&det)det.innerHTML=renderDetail(emp);
}

function salvarFup(empId){
  const data=document.getElementById(`fd-${empId}`).value;

  if(!data||!hist){alert('Preencha a data e o histórico.');return;}

  S.fup.push({id:Date.now(),empId,data,tipo,hist,disc:hist,enc:''});

// ─── FAROL HELPERS ───────────────────────────────────────────────────────────
const WORDS_RED=['paralis','embargo','irregular','inadimpl','bloqueio','notificaç','autuaç','infraç','embargo','judicial','liminar'];
const WORDS_AMB=['atraso','pendên','revisão','negociaç','impasse','demora','indefin','suspens'];
function calcFarolAtraso(emp){
  // Vermelho quando qualquer marco ativo tem delta (dt - referência) positivo — igual à coluna Δ Marco
  const mAtivos=marcosAtivos(emp);
  return mAtivos.some(function(ma){
    const mcd=ma.dates;
    const dt=mcd.dt||null;
    const ref=mcd.dr||mcd.dl||null;
    if(!dt||!ref)return false;
    return Math.round((new Date(dt)-new Date(ref))/86400000)>0;
  })?'r':'g';
}
function calcFarolIA(emp){
  const ias=IA_UPD[emp.id]||[];
  const txt=ias.map(function(ia){return ia.txt.toLowerCase();}).join(' ');
  if(!txt)return'g';
  if(WORDS_RED.some(function(k){return txt.includes(k);}))return'r';
  if(WORDS_AMB.some(function(k){return txt.includes(k);}))return'a';
  return'g';
}
function calcFarolCapital(emp){
  const cap=(S.capitalStatus&&S.capitalStatus[emp.id])||emp.capital||'ok';
  if(cap==='nok'||cap==='analise')return'r';
  return'g';
}
function capitalLabel(emp){
  const cap=(S.capitalStatus&&S.capitalStatus[emp.id])||emp.capital||'ok';
  if(cap==='nok')return'NOK';
  if(cap==='analise')return'Em análise';
  return'OK';
}
function setCapital(empId,val){
  if(!S.capitalStatus)S.capitalStatus={};
  S.capitalStatus[empId]=val;
  saveData();
  const emp=EMPS_RAW.find(function(e){return e.id===empId;});
  if(emp){
    const det=document.getElementById('painel-detail');
    if(det)det.innerHTML=renderDetail(emp);
    // Atualiza dot de capital na sidebar
    const dotC=function(f){return f==='r'?'#EF4444':f==='a'?'#F59E0B':'#22C55E';};
    const fc=calcFarolCapital(emp);
    const li=document.querySelector('.painel-list-item[data-id="'+empId+'"] .pli-dots');
    if(li){const dots=li.querySelectorAll('.pli-dot');if(dots[2])dots[2].style.background=dotC(fc);}
    // Re-renderiza aba Farol se estiver visível
    const fv=document.getElementById('view-farol');
    if(fv&&fv.style.display!=='none')renderFarol();
  }
}
function farolPri(f){return f==='r'?2:f==='a'?1:0;}
function tglSubs(gid,tr){
  const rows=document.querySelectorAll('.sub-of-'+gid);
  const open=tr.dataset.open==='1';
  rows.forEach(function(r){r.style.display=open?'none':'';});
  tr.dataset.open=open?'0':'1';
  const chev=tr.querySelector('.sub-chev');
  if(chev)chev.style.transform=open?'':'rotate(90deg)';
}
function farolDot(f,title){
  const c=f==='r'?'#EF4444':f==='a'?'#F59E0B':'#22C55E';
  return`<div title="${title}" style="display:flex;flex-direction:column;align-items:center;gap:2px">
    <div style="width:14px;height:14px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c}55"></div>
    <div style="font-size:8px;font-weight:700;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.04em">${title}</div>
  </div>`;
}

// ─── FAROL ───────────────────────────────────────────────────────────────────
function renderFarol(){
  const c=document.getElementById('view-farol');
  const emps=[...EMPS_RAW].map(function(e){
    const fa=calcFarolAtraso(e),fi=calcFarolIA(e),fc=calcFarolCapital(e);
    return Object.assign({},e,{
      score:calcScore(e),
      _fa:fa,_fi:fi,_fc:fc,
      _sortKey:farolPri(fa)*16+farolPri(fi)*4+farolPri(fc),
      _marcoAt:(marcoAtual(e)||{atraso:0}).atraso
    });
  }).sort(function(a,b){return b._sortKey-a._sortKey||b._marcoAt-a._marcoAt;});
  if(farolSort.col){
    const d=farolSort.dir;
    emps.sort(function(a,b){
      if(farolSort.col==='farol')return d*(b._sortKey-a._sortKey);
      if(farolSort.col==='emp'){const na=a.nome.toLowerCase(),nb=b.nome.toLowerCase();return d*(na<nb?-1:na>nb?1:0);}
      if(farolSort.col==='fase'){return d*(a.fase<b.fase?-1:a.fase>b.fase?1:0);}
      if(farolSort.col==='dt'){const da=marcoAtualDates(a).dt||'',db=marcoAtualDates(b).dt||'';return d*(da<db?-1:da>db?1:0);}
      if(farolSort.col==='dl'){const da=marcoAtualDates(a).dl||'',db=marcoAtualDates(b).dl||'';return d*(da<db?-1:da>db?1:0);}
      if(farolSort.col==='dr'){const da=marcoAtualDates(a).dr||'',db=marcoAtualDates(b).dr||'';return d*(da<db?-1:da>db?1:0);}
      if(farolSort.col==='delta')return d*(a._marcoAt-b._marcoAt);
      return 0;
    });
  }
  const faseLabel={preobra:'Pré-Obra',obra:'Obra',entrega:'Entrega'};
  if(!S.coment)S.coment={};
  const colW='11.11%';
  c.innerHTML=`<div class="tbl-wrap"><table style="table-layout:fixed;width:100%">
    <colgroup>${Array(9).fill(`<col style="width:${colW}">`).join('')}</colgroup>
    <thead><tr>
      ${['emp','fase','marco','dl','dr','dt','delta','farol',''].map(function(k,i){
        const labels=['Empreendimento','Fase','Marco Atual','Lançamento','Repactuado','Tendência','Δ Marco','Farol',''];
        const aligns=['left','center','left','center','center','center','center','center','center'];
        if(!k)return`<th></th>`;
        const active=farolSort.col===k;
        const arrow=active?(farolSort.dir===1?'↑':'↓'):'';
        return`<th onclick="sortFarol('${k}')" style="text-align:${aligns[i]};cursor:pointer;user-select:none;white-space:nowrap">${labels[i]}${arrow?` <span style="color:var(--primary);font-size:10px">${arrow}</span>`:''}</th>`;
      }).join('')}
    </tr></thead>
    <tbody>${emps.flatMap(function(e){
      const mAtivos=marcosAtivos(e);
      const hasComent=!!(S.coment[e.id]);
      const balloonColor=hasComent?'var(--primary)':'var(--muted-fg)';
      const balloonFill=hasComent?'currentColor':'none';
      const balloon=`<button onclick="tglComent('cmt-${e.id}','${e.id}')" style="background:none;border:none;cursor:pointer;padding:4px;color:${balloonColor};display:inline-flex;align-items:center;border-radius:4px" title="${hasComent?'Ver/editar comentário':'Adicionar comentário'}"><svg width="14" height="14" viewBox="0 0 24 24" fill="${balloonFill}" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>`;
      if(!mAtivos.length){
        return[`<tr id="fr-${e.id}">
          <td style="font-size:11px;font-weight:400;color:var(--card-fg)">${esc(e.nome)}</td>
          <td style="text-align:center"><span class="fase-pill ${e.fase}">${faseLabel[e.fase]}</span></td>
          <td colspan="4" style="color:var(--muted-fg);text-align:center;font-size:11px">—</td>
          <td></td>
          <td><div style="display:flex;gap:8px;align-items:center;justify-content:center">${farolDot(e._fa,'Cron')}${farolDot(e._fi,'IA')}${farolDot(e._fc,'Cap')}</div></td>
          <td style="text-align:center">${balloon}</td>
        </tr>`];
      }
      return mAtivos.map(function(ma,mi){
        const mcd=ma.dates;
        const dt=mcd.dt||null;
        const ref=mcd.dr||mcd.dl||null;
        const delta=dt&&ref?Math.round((new Date(dt)-new Date(ref))/86400000):null;
        const difLabel=delta===null?'—':delta>0?'+'+delta+'d':delta===0?'0d':delta+'d';
        const difColor=delta>0?'var(--warn)':delta<0?'var(--success)':'var(--muted-fg)';
        const marcoHtml=`<span style="font-size:12px;font-weight:400;color:var(--card-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block">${esc(ma.nome)}</span>`;
        const empCell=mi===0
          ?`<td style="font-size:11px;font-weight:400;color:var(--card-fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top" rowspan="${mAtivos.length}">${esc(e.nome)}</td>`
          :'';
        const faseCell=mi===0
          ?`<td style="text-align:center;vertical-align:top" rowspan="${mAtivos.length}"><span class="fase-pill ${e.fase}">${faseLabel[e.fase]}</span></td>`
          :'';
        const farolCell=mi===0
          ?`<td rowspan="${mAtivos.length}"><div style="display:flex;gap:8px;align-items:center;justify-content:center">${farolDot(e._fa,'Cron')}${farolDot(e._fi,'IA')}${farolDot(e._fc,'Cap')}</div></td>`
          :'';
        const balloonCell=mi===0?`<td style="text-align:center;vertical-align:top" rowspan="${mAtivos.length}">${balloon}</td>`:'';
        const rowId=mi===0?`id="fr-${e.id}"`:'';
        return`<tr ${rowId}>
          ${empCell}
          ${faseCell}
          <td style="overflow:hidden">${marcoHtml}</td>
          <td style="text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted-fg)">${fmtD(mcd.dl)||'—'}</td>
          <td style="text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted-fg)">${fmtD(mcd.dr)||'—'}</td>
          <td style="text-align:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted-fg)">${fmtD(dt)||'—'}</td>
          <td style="text-align:center;font-weight:600;font-size:12px;color:${difColor};font-variant-numeric:tabular-nums">${difLabel}</td>
          ${farolCell}
          ${balloonCell}
        </tr>`;
      });
    }).join('')}</tbody>
  </table></div>`;
}

// ─── HISTÓRICO ───────────────────────────────────────────────────────────────
function renderHistCards(){
  const fupsF=(histSelId
    ?[...S.fup].filter(function(f){return f.empId===histSelId;})
    :[...S.fup]
  ).sort(function(a,b){return b.data.localeCompare(a.data);});

  // IA entries: pull from IA_UPD for selected emp or all emps
  const iaEntries=[];
  const empsIA=histSelId?[EMPS_RAW.find(function(e){return e.id===histSelId;})].filter(Boolean):EMPS_RAW;
  empsIA.forEach(function(emp){
    (IA_UPD[emp.id]||[]).forEach(function(ia){
      iaEntries.push({empId:emp.id,empNome:emp.nome,fonte:ia.fonte,txt:ia.txt});
    });
  });

  if(!fupsF.length&&!iaEntries.length)return`<div style="padding:24px;color:var(--muted-fg);font-size:13px">Nenhum registro encontrado.</div>`;

  const fupCards=fupsF.map(function(f){
    const emp=EMPS_RAW.find(function(e){return e.id===f.empId;});
    const isPainelPmo=f.tipo==='painel-pmo';
    const tipoTxt=f.tipo==='gestao'?'Gestão SPEs':f.tipo==='entrega'?'Entrega':isPainelPmo?'Painel PMO':(f.tipo||'—');
    const tipoColor=f.tipo==='entrega'?'var(--success)':isPainelPmo?'#92400E':f.tipo==='gestao'?'var(--primary)':'var(--muted-fg)';
    const tipoBg=isPainelPmo?'#FEF3C7':'';
    const tipoBadge=`<span style="padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;background:${tipoBg||`color-mix(in srgb,${tipoColor} 12%,transparent)`};color:${tipoColor}">${esc(tipoTxt)}</span>`;
    const histTxt=f.hist||f.disc||'';
    const bullets=histTxt.split('\n').filter(function(l){return l.trim();}).map(function(l){
      return`<div class="fup-bullet"><div class="fup-bullet-dot"></div><span>${esc(l.replace(/^\d+\.\s*/,''))}</span></div>`;
    }).join('');
    const empLabel=!histSelId&&emp?`<span style="font-size:11px;font-weight:400;color:var(--muted-fg)">${esc(emp.nome)}</span>`:'';
    const delBtn=`<button onclick="deleteFup(${f.id})" title="Excluir registro" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--muted-fg);padding:2px 4px;border-radius:4px;font-size:12px;line-height:1" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--muted-fg)'">✕</button>`;
    return`<div class="fup-card" style="${isPainelPmo?'border-left:3px solid #D97706':''}">
      <div class="fup-card-top">
        <span class="fup-card-date">${fmtD(f.data)}</span>
        ${tipoBadge}
        ${empLabel}
        ${delBtn}
      </div>
      ${bullets?`<div class="fup-card-enc">${bullets}</div>`:''}
    </div>`;
  }).join('');

  const iaCards=iaEntries.length?`<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:10px">${iaEntries.map(function(ia){
    const empLabel=!histSelId?`<span style="font-size:11px;font-weight:400;color:var(--muted-fg);margin-left:auto">${esc(ia.empNome)}</span>`:'';
    const fonteLabel=ia.fonte==='reuniao'?'Reunião FUP':'WhatsApp';
    const fonteBadge=`<span style="padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;background:color-mix(in srgb,#7C3AED 12%,transparent);color:#7C3AED">${esc(fonteLabel)}</span>`;
    const iaBadge=`<span style="padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;background:color-mix(in srgb,#7C3AED 18%,transparent);color:#7C3AED">IA</span>`;
    const bullets=ia.txt.split(/[.\n]/).filter(function(l){return l.trim().length>10;}).map(function(l){
      return`<div class="fup-bullet"><div class="fup-bullet-dot" style="background:#7C3AED"></div><span>${esc(l.trim())}</span></div>`;
    }).join('');
    return`<div class="fup-card" style="border-left:3px solid #7C3AED22">
      <div class="fup-card-top">
        ${iaBadge}
        ${fonteBadge}
        ${empLabel}
      </div>
      ${bullets?`<div class="fup-card-enc">${bullets}</div>`:`<div class="fup-card-enc"><div class="fup-bullet"><div class="fup-bullet-dot" style="background:#7C3AED"></div><span>${esc(ia.txt)}</span></div></div>`}
    </div>`;
  }).join('')}</div>`:'';

  return`<div style="display:flex;flex-direction:column;gap:10px">${fupCards}${iaCards}</div>`;
}

// ─── CRONOGRAMA ──────────────────────────────────────────────────────────────
function sortCronograma(col){
  if(cronSort.col===col)cronSort.dir*=-1;else{cronSort.col=col;cronSort.dir=1;}
  renderCronograma();
}
function setCronFilter(f){cronFilter=f;renderCronograma();}
function applyCronFilters(){
  cronEmpFilter=document.getElementById('cfEmp')?.value||'';
  cronMarcoFilter=document.getElementById('cfMarco')?.value||'';
  renderCronograma();
}
function renderCronograma(){
  const c=document.getElementById('view-cronograma');
  const smLinkSvg=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

  // Build all rows
  let rows=[];
  EMPS_RAW.forEach(function(emp){
    const mseq=genMarcosSeq(emp);
    const mdates=genMarcosDates(emp);
    mseq.forEach(function(m,i){
      const d=mdates[i];
      const ref=d.dr||d.dl;
      const deltaD=(d.dt&&ref)?Math.round((new Date(d.dt)-new Date(ref))/86400000):null;
      rows.push({emp,nome_emp:emp.nome,marco:m.nome,st:m.st,i,dl:d.dl,dr:d.dr,dt:d.dt,delta:deltaD});
    });
  });

  // Apply filters
  if(cronFilter!=='todas') rows=rows.filter(function(r){return r.st===cronFilter;});
  if(cronEmpFilter) rows=rows.filter(function(r){return r.emp.id===cronEmpFilter;});
  if(cronMarcoFilter) rows=rows.filter(function(r){return r.i===parseInt(cronMarcoFilter);});

  // Sort
  if(cronSort.col){
    const d=cronSort.dir;
    rows.sort(function(a,b){
      if(cronSort.col==='emp'){return d*(a.nome_emp.localeCompare(b.nome_emp,'pt'));}
      if(cronSort.col==='marco'){return d*(a.i-b.i);}
      if(cronSort.col==='dl'){return d*((a.dl||'').localeCompare(b.dl||''));}
      if(cronSort.col==='dr'){return d*((a.dr||'').localeCompare(b.dr||''));}
      if(cronSort.col==='dt'){return d*((a.dt||'').localeCompare(b.dt||''));}
      if(cronSort.col==='delta'){const da=a.delta===null?9999:a.delta,db=b.delta===null?9999:b.delta;return d*(da-db);}
      return 0;
    });
  } else {
    rows.sort(function(a,b){
      const ne=a.nome_emp.localeCompare(b.nome_emp,'pt');
      return ne!==0?ne:a.i-b.i;
    });
  }

  // Helpers
  function thC(col,label,align){
    const active=cronSort.col===col;
    const arr=active?(cronSort.dir===1?'↑':'↓'):'';
    return`<th onclick="sortCronograma('${col}')" style="text-align:${align||'center'};cursor:pointer;user-select:none;white-space:nowrap">${label}${arr?` <span style="color:var(--primary);font-size:10px">${arr}</span>`:''}</th>`;
  }
  const stDot=function(st){
    const col=st==='concluido'?'#22C55E':st==='andamento'?'var(--primary)':'var(--border)';
    return`<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${col};flex-shrink:0;margin-right:5px"></span>`;
  };
  const pillStyle=function(active){
    return active
      ?'padding:4px 12px;border-radius:99px;font-size:11px;font-weight:700;background:var(--primary);color:#fff;border:none;cursor:pointer;font-family:var(--font)'
      :'padding:4px 12px;border-radius:99px;font-size:11px;font-weight:600;background:var(--accent);color:var(--muted-fg);border:none;cursor:pointer;font-family:var(--font)';
  };

  // Empreendimento options for select
  const empsSorted=[...EMPS_RAW].sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
  const empOpts=empsSorted.map(function(e){
    return`<option value="${e.id}"${cronEmpFilter===e.id?' selected':''}>${esc(e.nome)}</option>`;
  }).join('');

  // Marco options for select
  const marcoOpts=MARCOS_SEQ.map(function(m,i){
    return`<option value="${i}"${cronMarcoFilter===String(i)?' selected':''}>${esc(m.nome)}</option>`;
  }).join('');

  const selStyle='padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:11px;font-family:var(--font);cursor:pointer;min-width:160px';

  c.innerHTML=`
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    <button style="${pillStyle(cronFilter==='todas')}" onclick="setCronFilter('todas')">Todas</button>
    <button style="${pillStyle(cronFilter==='andamento')}" onclick="setCronFilter('andamento')">Em andamento</button>
    <button style="${pillStyle(cronFilter==='ainicial')}" onclick="setCronFilter('ainicial')">A iniciar</button>
    <button style="${pillStyle(cronFilter==='concluido')}" onclick="setCronFilter('concluido')">Concluídas</button>
    <div style="width:1px;height:20px;background:var(--border);margin:0 4px"></div>
    <select id="cfEmp" style="${selStyle}" onchange="applyCronFilters()">
      <option value="">Todos os empreendimentos</option>${empOpts}
    </select>
    <select id="cfMarco" style="${selStyle}" onchange="applyCronFilters()">
      <option value="">Todos os marcos</option>${marcoOpts}
    </select>
    ${(cronFilter!=='todas'||cronEmpFilter||cronMarcoFilter)?`<button onclick="cronFilter='todas';cronEmpFilter='';cronMarcoFilter='';renderCronograma()" style="padding:4px 10px;border-radius:6px;font-size:11px;font-family:var(--font);background:transparent;border:1px solid var(--border);color:var(--muted-fg);cursor:pointer">Limpar filtros</button>`:''}
    <span style="margin-left:auto;font-size:11px;color:var(--muted-fg)">${rows.length} linha${rows.length!==1?'s':''}</span>
  </div>
  <div class="tbl-wrap"><table style="table-layout:fixed;width:100%">
    <colgroup>
      <col style="width:18%"><col style="width:22%"><col style="width:11%"><col style="width:11%"><col style="width:11%"><col style="width:8%"><col style="width:11%"><col style="width:8%">
    </colgroup>
    <thead><tr>
      ${thC('emp','Empreendimento','left')}
      ${thC('marco','Marco','left')}
      ${thC('dl','Lançamento')}
      ${thC('dr','Repactuado')}
      ${thC('dt','Tendência')}
      <th style="text-align:center;white-space:nowrap">Smartsheet</th>
      ${thC('delta','Δ Marco')}
      <th></th>
    </tr></thead>
    <tbody>${rows.length?rows.map(function(r,ri){
      const prevEmpId=ri>0?rows[ri-1].emp.id:null;
      const newGroup=r.emp.id!==prevEmpId;
      const empCell=newGroup
        ?`<td style="font-size:11px;font-weight:400;color:var(--fg);text-transform:uppercase;letter-spacing:.04em;vertical-align:top;padding-top:8px">${esc(r.nome_emp)}</td>`
        :`<td style="border-top:none;color:transparent;font-size:8px">·</td>`;
      const deltaC=r.delta===null?'—':(r.delta>0?`<span style="color:var(--warn);font-weight:600">+${r.delta}d</span>`:(r.delta<0?`<span style="color:var(--success);font-weight:600">${r.delta}d</span>`:`<span style="color:var(--muted-fg)">0d</span>`));
      const smData=SMARTSHEET_MARCOS[r.emp.id]||{};
      const smDt=smData[r.i]?fmtD(smData[r.i].dt)||'—':'—';
      const rowBorder=newGroup&&ri>0?'border-top:2px solid var(--border)':'';
      return`<tr style="${rowBorder}">
        ${empCell}
        <td style="font-size:12px"><div style="display:flex;align-items:center">${stDot(r.st)}<span style="color:${r.st==='concluido'?'var(--muted-fg)':'var(--fg)'}">${esc(r.marco)}</span></div></td>
        <td class="date-cell">${fmtD(r.dl)||'—'}</td>
        <td class="date-cell">—</td>
        <td class="date-cell">${fmtD(r.dt)||'—'}</td>
        <td class="date-cell" style="text-align:center">${smDt}</td>
        <td style="text-align:center;font-size:12px">${deltaC}</td>
        <td></td>
      </tr>`;
    }).join(''):`<tr><td colspan="8" style="text-align:center;padding:32px;color:var(--muted-fg);font-size:12px">Nenhum resultado com os filtros selecionados.</td></tr>`}</tbody>
  </table></div>`;
}

function openModal(){document.getElementById('modalFup').classList.add('open');document.getElementById('mData').value=TODAY.toISOString().split('T')[0];if(curEmpId)document.getElementById('mEmp').value=curEmpId;}
function openModalHist(){document.getElementById('modalFup').classList.add('open');document.getElementById('mData').value=TODAY.toISOString().split('T')[0];if(histSelId)document.getElementById('mEmp').value=histSelId;}
function closeModal(){document.getElementById('modalFup').classList.remove('open');}
function salvarModal(){
  const empId=document.getElementById('mEmp').value;

  if(!data||!hist){alert('Preencha data e histórico.');return;}
  const tipo=document.getElementById('mTipo').value||'gestao';
  S.fup.push({id:Date.now(),empId,data,tipo,hist,disc:hist,enc:''});

  document.getElementById('mHist').value='';
  renderCurrentView();
}
document.getElementById('modalFup').addEventListener('click',function(e){if(e.target===this)closeModal();});

// ─── SORT FAROL ──────────────────────────────────────────────────────────────
function sortFarol(col){
  farolSort.dir=farolSort.col===col?farolSort.dir*-1:1;
  farolSort.col=col;
  renderFarol();
}

// ─── COMENTÁRIOS FAROL ───────────────────────────────────────────────────────
function tglComent(trId,empId){
  const ex=document.getElementById(trId);
  if(ex){ex.remove();return;}
  const srcRow=document.getElementById('fr-'+empId);
  if(!srcRow)return;
  if(!S.coment)S.coment={};
  const cur=S.coment[empId]||'';
  const exTr=document.createElement('tr');
  exTr.id=trId;
  exTr.innerHTML=`<td colspan="7" style="padding:8px 16px 10px;background:var(--accent);border-bottom:1px solid var(--border)"><div style="display:flex;gap:8px;align-items:flex-start"><textarea id="cmtxt-${empId}" style="flex:1;min-height:56px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--card-fg);font-size:12px;resize:vertical;font-family:inherit">${esc(cur)}</textarea><button onclick="salvarComent('${empId}')" style="padding:5px 12px;background:var(--primary);color:white;border:none;border-radius:6px;font-size:11px;cursor:pointer;font-weight:600;flex-shrink:0">Salvar</button></div></td>`;
  srcRow.parentNode.insertBefore(exTr,srcRow.nextSibling);
  document.getElementById('cmtxt-'+empId).focus();
}
function salvarComent(empId){
  if(!S.coment)S.coment={};
  S.coment[empId]=(document.getElementById('cmtxt-'+empId)||{}).value||'';
  saveData();
  const ex=document.getElementById('cmt-'+empId);
  if(ex)ex.remove();
  renderFarol();
}
function deleteFup(id){
  if(!confirm('Excluir este registro?'))return;
  S.fup=S.fup.filter(function(f){return f.id!==id;});
  saveData();
  renderHistorico();
  const det=document.getElementById('painel-detail');
  if(det&&curEmpId){const emp=EMPS_RAW.find(function(e){return e.id===curEmpId;});if(emp)det.innerHTML=renderDetail(emp);}
}
function importFromPainelPMO(){
  let raw;
  try{raw=JSON.parse(localStorage.getItem('pmo_sz_v4')||'null');}catch(e){raw=null;}
  if(!raw||!Array.isArray(raw.emps)){alert('Painel PMO não encontrado no localStorage.\nAbra https://seazone-tech.github.io/painel-pmo-spots/ primeiro.');return;}
  const byName={};
  EMPS_RAW.forEach(function(e){byName[e.nome.toLowerCase().trim()]=e.id;});
  let count=0;
  const existingSrcs=new Set(S.fup.filter(function(f){return f._src==='painel-pmo';}).map(function(f){return f._srcKey;}));
  raw.emps.forEach(function(emp){
    const empNome=(emp.nome||'').toLowerCase().trim();
    const empId=byName[empNome];
    if(!empId)return;
    const cmts=(emp.governanca&&emp.governanca.historico&&emp.governanca.historico.comentarios)||[];
    cmts.forEach(function(c,ci){
      const key=empId+'_'+ci+'_'+(c.data||'')+'_'+(c.texto||'').slice(0,20);
      if(existingSrcs.has(key))return;
      const txt=(c.texto||'').trim();
      if(!txt)return;
      // converte DD/MM/YYYY → YYYY-MM-DD se necessário
      const rawD=c.data||'';
      let isoD;
      if(/^\d{4}-\d{2}-\d{2}/.test(rawD)){isoD=rawD.slice(0,10);}
      else if(/^\d{2}\/\d{2}\/\d{4}/.test(rawD)){const p=rawD.split('/');isoD=`${p[2].slice(-4)}-${p[1]}-${p[0]}`;}
      else{isoD=TODAY.toISOString().split('T')[0];}
      S.fup.push({
        id:Date.now()+Math.random(),
        empId:empId,
        data:isoD,
        tipo:'painel-pmo',
        hist:txt,
        disc:txt,
        enc:'',
        _src:'painel-pmo',
        _srcKey:key
      });
      count++;
    });
  });
  saveData();
  renderHistorico();
  alert('Importados '+count+' registros do Painel PMO.');
}
